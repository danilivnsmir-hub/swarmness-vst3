name: Build

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub Release with this tag (e.g. v2.0.0); leave empty for a plain build"
        required: false
        default: ""

env:
  BUILD_TYPE: Release
  PLUGINVAL_STRICTNESS: 10

jobs:
  # ---------------------------------------------------------------------------
  windows:
    name: Windows (VST3 + Standalone)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel --target Swarmness_VST3 Swarmness_Standalone SwarmnessTests

      - name: DSP tests
        run: build\SwarmnessTests_artefacts\Release\SwarmnessTests.exe

      - name: pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          # pluginval.exe is a GUI-subsystem app: wait for it explicitly and use its real exit code.
          $pvArgs = @("--strictness-level", "$env:PLUGINVAL_STRICTNESS", "--verbose", "--timeout-ms", "600000",
                    "--output-dir", "pluginval-logs", "build\Swarmness_artefacts\Release\VST3\Swarmness.vst3")
          $p = Start-Process -FilePath ".\pluginval\pluginval.exe" -ArgumentList $pvArgs -Wait -PassThru -NoNewWindow
          Get-ChildItem pluginval-logs -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 40 }
          Write-Host "pluginval exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Crash diagnostics
        if: failure()
        shell: pwsh
        run: |
          Get-WinEvent -LogName Application -MaxEvents 30 |
            Where-Object { $_.ProviderName -in @('Application Error', 'Windows Error Reporting', '.NET Runtime') } |
            Format-List TimeCreated, ProviderName, Message

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(Swarmness VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$version" "/DBuildDir=$pwd\build\Swarmness_artefacts\Release" "/Odist" packaging\windows\Swarmness.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Zip plug-ins
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\zip | Out-Null
          Copy-Item -Recurse build\Swarmness_artefacts\Release\VST3\Swarmness.vst3 dist\zip\
          Copy-Item build\Swarmness_artefacts\Release\Standalone\Swarmness.exe dist\zip\
          Compress-Archive -Path dist\zip\* -DestinationPath dist\Swarmness-Windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Swarmness-Windows
          path: |
            dist/*.exe
            dist/*.zip

  # ---------------------------------------------------------------------------
  macos:
    name: macOS Universal (VST3 + AU + Standalone)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel --target Swarmness_VST3 Swarmness_AU Swarmness_Standalone SwarmnessTests -- -quiet

      - name: DSP tests
        run: build/SwarmnessTests_artefacts/Release/SwarmnessTests

      - name: Verify universal binaries and ad-hoc sign
        run: |
          ART=build/Swarmness_artefacts/Release
          lipo -info "$ART/VST3/Swarmness.vst3/Contents/MacOS/Swarmness"
          lipo -info "$ART/AU/Swarmness.component/Contents/MacOS/Swarmness"
          for b in "$ART/VST3/Swarmness.vst3" "$ART/AU/Swarmness.component" "$ART/Standalone/Swarmness.app"; do
            codesign --force --deep --sign - "$b"
          done

      - name: pluginval (VST3 + AU)
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          PV=pluginval.app/Contents/MacOS/pluginval
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/Swarmness_artefacts/Release/AU/Swarmness.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          $PV --strictness-level $PLUGINVAL_STRICTNESS --validate-in-process --timeout-ms 600000 build/Swarmness_artefacts/Release/VST3/Swarmness.vst3
          $PV --strictness-level $PLUGINVAL_STRICTNESS --validate-in-process --timeout-ms 600000 ~/Library/Audio/Plug-Ins/Components/Swarmness.component

      - name: auval
        run: auval -strict -v aufx SwMs OpAu

      - name: Installer (.pkg) and zip
        run: |
          VERSION=$(sed -nE 's/^project\(Swarmness VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          packaging/macos/make_pkg.sh "$VERSION" build/Swarmness_artefacts/Release dist
          (cd build/Swarmness_artefacts/Release && ditto -c -k --keepParent VST3/Swarmness.vst3 ../../../dist/Swarmness-macOS-VST3.zip \
            && ditto -c -k --keepParent AU/Swarmness.component ../../../dist/Swarmness-macOS-AU.zip \
            && ditto -c -k --keepParent Standalone/Swarmness.app ../../../dist/Swarmness-macOS-Standalone.zip)

      - uses: actions/upload-artifact@v4
        with:
          name: Swarmness-macOS
          path: |
            dist/*.pkg
            dist/*.zip

  # ---------------------------------------------------------------------------
  linux:
    name: Linux (VST3 + Standalone)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev xvfb

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --target Swarmness_VST3 Swarmness_Standalone SwarmnessTests

      - name: DSP tests
        run: build/SwarmnessTests_artefacts/Release/SwarmnessTests

      - name: pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -q pluginval.zip
          xvfb-run -a ./pluginval --strictness-level $PLUGINVAL_STRICTNESS --validate-in-process --timeout-ms 600000 build/Swarmness_artefacts/Release/VST3/Swarmness.vst3

      - name: Package
        run: |
          mkdir -p dist
          (cd build/Swarmness_artefacts/Release && zip -qr ../../../dist/Swarmness-Linux-x64.zip VST3/Swarmness.vst3 Standalone/Swarmness)

      - uses: actions/upload-artifact@v4
        with:
          name: Swarmness-Linux
          path: dist/*.zip

  # ---------------------------------------------------------------------------
  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [ windows, macos, linux ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Swarmness ${{ inputs.release_tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
